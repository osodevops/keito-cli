[workspace]
members = ["cargo:."]

# Production capture uses .github/workflows/release.yml: finalize the guard,
# embed its hash into keito, then package both plus the manifest. cargo-dist
# output without that pairing is intentionally manual-CLI-only.
[dist]
cargo-dist-version = "0.30.2"
allow-dirty = ["ci"]
ci = "github"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell", "homebrew"]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
tap = "osodevops/homebrew-tap"
formula = "keito"
publish-jobs = ["homebrew"]
